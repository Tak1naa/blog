server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # TLS terminates at HAProxy. Never expose this HTTP listener's scheme/port
    # in explicit or automatic directory redirects; keep the browser's origin.
    absolute_redirect off;
    charset utf-8;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /blog { return 308 /blog/; }
    location = /blog/healthz { default_type application/json; return 200 '{"status":"ok"}'; }
    # Management and user provisioning remain loopback/container-only until the
    # owner bootstraps an administrator. Anonymous comment APIs stay available.
    location ~ ^/blog/api/comment/(?:api/)?(?:ui|user|token|oauth)(?:/|$) { return 403; }
    location /blog/api/comment/ {
        proxy_pass http://waline:8360/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location /blog/api/music/ {
        proxy_pass http://music-bridge:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location ~* ^/blog/.*\.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|avif|woff2?|ttf|mp3|wav|ogg|mp4|webm)$ {
        expires 1d;
        try_files $uri =404;
    }
    location /blog/ {
        add_header Cache-Control no-cache;
        try_files $uri $uri/ $uri.html =404;
    }
    location / { return 404; }
}
