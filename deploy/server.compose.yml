name: takina-blog
services:
  postgres:
    image: ${POSTGRES_IMAGE:?pinned image digest required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: waline
      POSTGRES_USER: waline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - waline-db:/var/lib/postgresql/data
      - ./waline.pgsql:/docker-entrypoint-initdb.d/10-waline.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U waline -d waline"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
  waline:
    image: ${WALINE_IMAGE:?pinned image digest required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SITE_NAME: Takina Ying
      SITE_URL: https://tak1na.top/blog/
      SERVER_URL: https://tak1na.top/blog/api/comment
      SECURE_DOMAINS: tak1na.top
      JWT_TOKEN: ${WALINE_JWT_TOKEN:?required}
      COMMENT_AUDIT: "true"
      LOGIN: disable
      # Anonymous-only blog: do not make every API request depend on an
      # unreachable third-party OAuth discovery service. Fetch supports data URLs.
      OAUTH_URL: 'data:application/json,{"services":[]}'
      DISABLE_REGION: "true"
      DISABLE_USERAGENT: "true"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: waline
      PG_USER: waline
      PG_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8360/api/comment?path=/health&pageSize=1',{headers:{Origin:'https://tak1na.top'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 10
    mem_limit: 384m
    networks: [backend, egress]
    security_opt: ["no-new-privileges:true"]
  music-bridge:
    image: ${MUSIC_BRIDGE_IMAGE:?immutable local release tag required}
    restart: unless-stopped
    environment:
      PORT: "3000"
      NETEASE_PLAYLIST_ID: ${NETEASE_PLAYLIST_ID:-}
      NETEASE_COOKIE: ${NETEASE_COOKIE:-}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 192m
    networks: [backend, egress]
    security_opt: ["no-new-privileges:true"]
  web:
    image: ${NGINX_IMAGE:?pinned image digest required}
    restart: unless-stopped
    depends_on: [waline, music-bridge]
    ports: ["127.0.0.1:18090:8080"]
    volumes:
      - ${RELEASE_DIR:?required}/www:/usr/share/nginx/html:ro
      - ./server.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/blog/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    mem_limit: 96m
    # Docker suppresses published ports on an internal-only network. Keep only
    # this explicit loopback binding, plus the isolated backend connection.
    networks: [backend, egress]
    security_opt: ["no-new-privileges:true"]
networks:
  backend:
    internal: true
  egress: {}
volumes:
  waline-db:
