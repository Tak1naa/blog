site:
  name:
    class: text
    custom: Takina
  icon: /media/takina/avatar.png

nav:
  menu:
    Home: /
    Articles:
      Archives: /archives/ || fas fa-folder-closed
      Categories: /categories/ || fas fa-clone
      Tags: /tags/ || fas fa-tags
    Community:
      Links: /links/ || fas fa-user-group
    Profile:
      Music: /music/ || fas fa-music
      About: /about/ || fas fa-user
  right:
    random: true

hometop:
  enable: true
  banner:
    title: Capturing Ideas<br>Like Ambient Starlight
    desc:
      - Engineering, design systems, and interaction
      - Curiosity and craft
  group:
    Explore Articles: /archives/ || fas fa-book-open || linear-gradient(120deg,#5b8def,#8f6fe8)
  recommendList:
    - order: 1
      sup: Featured
      title: High-Performance Speedtest Architecture
      url: /posts/speedtest-architecture/
      img: /media/takina/aquarium.jpg
      color: none

aside:
  home:
    noSticky: about
    Sticky: newestPost,allInfo
  post:
    noSticky: about
    Sticky: newestPost
  page:
    noSticky: about
    Sticky: newestPost,allInfo
  position: 0
  my_card:
    author:
      img: /media/takina/avatar.png
    description: Building tools, breaking things, and taking notes.
    content: A personal space for code, anime, and daily life.
    state:
      morning: ✨ Good morning, ready for a new day
      noon: 🍲 Lunch break
      afternoon: 🌞 Good afternoon
      night: 🌙 Welcome back into the night
      goodnight: Good night 😴
    witty_words:
      - Stay curious every day
      - Craft code with clarity and resonance
  toc:
    post: true
    page: false
    vague: true
  tags:
    enable: true
    limit: 20
  siteinfo:
    postcount: true
    wordcount: false
    pv: false
    uv: false
    updatetime: true
    runtimeenable: true
    runtime: "2026-09-21 00:00:00"

page:
  error: true
  tags: true
  categories: true
  archives: 0
  default:
    cover:
      - /media/takina/aquarium.jpg
      - /media/takina/night-action.jpg

post:
  default:
    cover:
      - /media/takina/aquarium.jpg
      - /media/takina/night-action.jpg
    locate: Global
    copyright:
      enable: true
      author: /media/takina/avatar.png
      license: CC BY-NC-SA 4.0
      licenurl: https://creativecommons.org/licenses/by-nc-sa/4.0/

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: both

lazyload:
  enable: false
  field: site
  placeholder: /media/brand/placeholder.svg
  errorimg: /media/brand/placeholder.svg

comment:
  use: waline
  commentBarrage: false
  lazyload: true
  count: true
  sidebar: false
  pv: false
  avatar: https://gravatar.com/avatar
  newest_comment:
    enable: false
    storage: .5
    limit: 5

waline:
  envId: /api/comment
  pageview: false
  option:
    login: disable
    reaction: false
    requiredMeta:
      - nick
      - mail

search:
  enable: true
  type: local
  tags:
    - Hexo
    - Solitude
  local:
    preload: false
    CDN: /search.xml

music:
  enable: false

pjax:
  enable: true

# Reimu-like placement only: keep Solitude's own cards and visual language.
index_post_list:
  direction: row
  cover: both

darkmode:
  enable: true
  button: true
  autoChangeMode: 1

# Modern browsers are the deployment target. Disabling nib's legacy prefixes
# also avoids its opacity() parser treating CSS custom properties as numbers.
css_prefix: false

footer:
  information:
    author: /media/takina/avatar.png
    left: {}
  group:
    Navigation:
      Archives: /archives/
      Tags: /tags/
      About: /about/
    Resources:
      Solitude: https://github.com/everfu/hexo-theme-solitude
      Firefly: https://github.com/CuteLeaf/Firefly
      Credits: /credits/
  randomlink: false
  runtime: true

extends:
  head:
    - <link rel="stylesheet" href="/custom/enhancements.css">
  body:
    - <script type="module" src="/custom/enhancements.js"></script>

# Fixed, self-hosted theme dependencies: no CDN font/script is needed to render
# navigation, image sources, search or PJAX. Keep the existing upstream versions.
CDN:
  options:
    fontawesome: /vendor/fontawesome-7.3.0/css/all.min.css
    pjax: /vendor/theme/pjax-0.2.8.min.js
    typeit_js: /vendor/theme/typeit-8.8.7.min.js
    snackbar: /vendor/theme/snackbar-0.1.16.min.js
    pace_js: /vendor/theme/pace-1.2.4.min.js
