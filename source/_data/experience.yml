version: 1
site:
  homePath: /
  title: Takina Ying
  # 副标题由 anime_quotes.yml 构建；每条必须有作品、角色和出处。

background:
  defaultMode: wallpaper
  intervalMs: 9000
  transitionMs: 1200
  overlayOpacity: 0.38
  wallpapers:
    - src: /media/takina/aquarium.jpg
      alt: 井之上泷奈与千束在蓝紫色水族馆中仰望鱼群，官方第 4 集画面
    - src: /media/takina/night-action.jpg
      alt: 井之上泷奈的深色行动特写，官方第 1 集画面
  video:
    enabled: true
    sources:
      - src: https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4
        type: video/mp4
    poster: /media/takina/aquarium.jpg
    timeoutMs: 8000

music:
  enabled: true
  apiBase: /api/music
  initialVolume: 0.7
  order: loop
  localTracks:
    - id: local-dog-days
      source: local
      title: Dog Days
      artists:
        - 作者未标注
      url: /media/music/dog-days.mp3
      cover: /media/takina/avatar.png

live2d:
  enabled: true
  defaultEnabled: false
  modelPaths:
    - /media/live2d/takina-chibi/takina-chibi.model3.json?v=face-alpha-20261006
  welcomeMessages:
    - 欢迎来到 Takina Ying！
    - 今天也要保持好奇呀。
  idleMessages:
    - 休息一下，看看远处吧。
    - 发现喜欢的文章了吗？

effects:
  enabled: true
  typewriter: true
  sakura: true
  maxParticles: 36

mobile:
  breakpoint: 768
  live2d: false
  video: false
  carousel: false
