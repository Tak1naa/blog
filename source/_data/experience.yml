version: 1
site:
  homePath: /
  title: Takina

background:
  defaultMode: wallpaper
  intervalMs: 9000
  transitionMs: 1200
  overlayOpacity: 0.38
  wallpapers:
    - src: /media/takina/aquarium.jpg
      alt: Aquarium scene with blue and purple ambient lighting
    - src: /media/takina/night-action.jpg
      alt: Night action illustration in deep cool tones
  video:
    enabled: true
    sources:
      - src: https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4
        type: video/mp4
    poster: /media/takina/aquarium.jpg
    timeoutMs: 8000

music:
  enabled: true
  apiBase: /api/music
  initialVolume: 0.7
  order: loop
  localTracks:
    - id: local-dog-days
      source: local
      title: Dog Days
      artists:
        - Manaka BGM
      url: /media/music/dog-days.mp3
      cover: /media/takina/avatar.png

live2d:
  enabled: true
  defaultEnabled: false
  videos:
    stretch: /media/companion/stretch-v1.webm
    think: /media/companion/think-v1.webm
    look: /media/companion/look-v1.webm
  modelPaths:
    - /media/live2d/takina-chibi/takina-chibi.model3.json?v=reference-278fdeef1009
  welcomeMessages:
    - Welcome to Takina Studio!
    - Stay curious every day.
  idleMessages:
    - Take a pause and look far ahead.
    - Discovering anything inspiring today?

effects:
  enabled: true
  typewriter: true
  sakura: true
  maxParticles: 36

mobile:
  breakpoint: 768
  live2d: false
  video: false
  carousel: true
